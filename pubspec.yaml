name: kutumba
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio
  audio_service: ^0.18.18
  just_audio: ^0.10.5
  audio_video_progress_bar: ^2.0.3

  # State management / DI
  provider: ^6.1.5+1
  get_it: ^9.2.1

  # UI
  carousel_slider: ^5.1.2
  flutter_html: ^3.0.0-beta.2
  font_awesome_flutter: ^10.12.0
  #  flick_video_player: ^0.5.0

  # Network
  http: ^1.6.0

  # Firebase
  firebase_messaging: ^16.1.2

  # System utilities
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  #  package_info_plus: ^4.2.0

  # Payments
  in_app_purchase: ^3.2.3

  # Utilities
  intl: ^0.20.2
  overlay_support: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
